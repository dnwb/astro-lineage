    excerpt: We fit the multi-band lightcurves of 40 fast blue optical transients
      (FBOTs) with the magnetar engine model. The mass of the FBOT ejecta, the
      initial spin period and polar magnetic field of the FBOT magnetars are
      respectively constrained to $M_{\rm{ej}}=0.18^{+0.52}_{-0.13}\,M_\odot$,
      $P_{\rm{i}}=9.4^{+8.1}_{-3.9}\,{\rm{ms}}$, and $B_{\rm
      p}=7^{+16}_{-5}\times10^{14}\,{\rm{G}}$.
