      paragraph: Abstract
    excerpt: "Magnetar engines are widely invoked to power luminous optical transients, but their early emission depends on the coupled evolution of engine injection, shock heating, adiabatic cooling, and radiative diffusion. We present TransFit-MAG, a time-dependent radiative-diffusion framework."
