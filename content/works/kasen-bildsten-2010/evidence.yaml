      paragraph: Abstract
    excerpt: We show that energy deposited into an expanding supernova remnant by a
      highly magnetic (B ~ 5 x 10^14 G) neutron star spinning at an initial
      period of P ~ 2-20 ms can substantially brighten the light curve. For
      magnetars with parameters in this range, the rotational energy is released
      on a timescale of days to weeks, which is comparable to the effective
      diffusion time through the supernova remnant.
