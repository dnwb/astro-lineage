      paragraph: Abstract
    excerpt: In this paper, we investigate two hydrogen-poor superluminous supernovae (SLSNe) iPTF15esb and iPTF13dcc whose light curves (LCs) show significant deviation from the smooth rise and fall. The LC of iPTF15esb exhibits two peaks and a post-peak plateau, and furthermore the late-time spectrum of iPTF15esb shows a strong, broad H$α$ emission line.
