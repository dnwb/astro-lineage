id: inference_target
label: Inference target
question: What physical quantity, property, or hypothesis does the Work attempt to infer?
default_risk: descriptive
terms:
  - id: term:jet-collimation-regime
    label: Jet collimation regime
    aliases: [collimated or uncollimated state]
    status: active
    definition: The modeled dynamical state in which cocoon pressure either does or does not substantially collimate a jet.
    examples: [Inferring that a GRB jet is collimated inside its progenitor and uncollimated after breakout.]
    counterexamples: [A directly measured afterglow jet-break angle.]
    boundary_notes: The regime is inferred through the model and must not be stored as an observable.
    curation_provenance: { actor_id: actor:agent-curator, recorded_at: "2026-09-04T09:20:00Z" }
    review_state: reviewed
    review_provenance: { actor_id: actor:human-curator, recorded_at: "2026-09-04T12:30:31Z" }
  - id: term:jet-breakout-time
    label: Jet breakout time
    aliases: [jet boundary-crossing time]
    status: active
    definition: The model-derived time required for a jet head to reach and cross a finite outer boundary such as a stellar surface.
    examples: [Breakout time inferred from jet injection and ambient-density parameters.]
    counterexamples: [The arXiv release date of a paper.]
    boundary_notes: This is a physical inference target, not a publication timestamp or direct observable.
    curation_provenance: { actor_id: actor:agent-curator, recorded_at: "2026-09-04T09:20:00Z" }
    review_state: reviewed
    review_provenance: { actor_id: actor:human-curator, recorded_at: "2026-09-04T12:30:31Z" }
  - id: term:intrinsic-luminosity
    label: Intrinsic luminosity
    aliases: [bolometric luminosity]
    status: active
    definition: The source luminosity property inferred by connecting the modeled radioactive heating and transport to observed light curves.
    examples:
      - Intrinsic luminosity inferred from the analytic light-curve solution.
    counterexamples:
      - A measured magnitude, which is an observable rather than an inference target.
    boundary_notes: This term names the quantity being inferred; it does not store a fitted value in the ontology taxonomy.
    curation_provenance:
      actor_id: actor:agent-curator
      recorded_at: "2026-09-04T04:00:00Z"
    review_state: reviewed
    review_provenance:
      actor_id: actor:human-curator
      recorded_at: "2026-09-04T12:30:31Z"
  - id: term:jet-choking-condition
    label: Jet choking condition
    aliases: [jet stalling criterion]
    status: active
    definition: The model-derived comparison determining whether a jet stalls before crossing its confining environment.
    examples: [Inferring choking when the jet stalling radius is smaller than the AGN-disk scale height.]
    counterexamples: [A directly measured photon transient.]
    boundary_notes: This is an inferred physical state, not an observable or the general jet-choking dynamics term.
    curation_provenance: { actor_id: actor:agent-curator, recorded_at: "2026-09-04T10:15:18Z" }
    review_state: reviewed
    review_provenance: { actor_id: actor:human-curator, recorded_at: "2026-09-04T12:30:31Z" }
  - id: term:expected-neutrino-yield
    label: Expected source neutrino yield
    aliases: [model neutrino yield]
    status: active
    definition: A source-level neutrino output inferred from a physical production model before detector response.
    examples: [The modeled neutrino output used to derive a fluence and expected detected event count.]
    counterexamples: [A detector's recorded neutrino event count.]
    boundary_notes: Keep the inferred source output separate from fluence and detector-count observable forms.
    curation_provenance: { actor_id: actor:agent-curator, recorded_at: "2026-09-04T10:15:19Z" }
    review_state: reviewed
    review_provenance: { actor_id: actor:human-curator, recorded_at: "2026-09-04T12:30:31Z" }
  - id: term:ejecta-physical-properties
    label: Ejecta physical properties
    aliases: [ejecta mass energy and opacity]
    status: active
    definition: Model parameters describing ejecta mass, kinetic or thermal energy, density structure, and opacity that are explored or fitted against transient data.
    examples: [Finding ejecta mass, kinetic energy, and opacity values compatible with an observed transient light curve.]
    counterexamples: [A measured bolometric light curve used as input to the fit.]
    boundary_notes: This term identifies model-derived physical properties; it does not assert a full posterior analysis, store fitted values, or describe the measured signal form.
    curation_provenance: { actor_id: actor:agent-curator, recorded_at: "2026-09-04T13:18:50Z" }
    review_state: reviewed
    review_provenance: { actor_id: actor:human-curator, recorded_at: "2026-09-04T22:15:06Z" }
  - id: term:progenitor-radius
    label: Progenitor radius
    aliases: [initial stellar radius]
    status: active
    definition: The pre-expansion source radius treated as a model parameter informed by early transient light-curve evolution.
    examples: [Finding a progenitor-radius value compatible with early observations in a diffusion-model fit.]
    counterexamples: [The angular size directly measured in an image.]
    boundary_notes: This is a model-derived source property, not a claim of posterior inference, a progenitor-system classification, or an observable form.
    curation_provenance: { actor_id: actor:agent-curator, recorded_at: "2026-09-04T13:19:00Z" }
    review_state: reviewed
    review_provenance: { actor_id: actor:human-curator, recorded_at: "2026-09-04T22:15:06Z" }
  - id: term:heating-source-parameters
    label: Heating-source parameters
    aliases: [radioactive and central-engine heating parameters]
    status: active
    definition: Model parameters describing the amplitude, distribution, and time dependence of radioactive or central-engine energy input.
    examples: [Finding a continuous central-engine heating history compatible with a fitted transient light curve.]
    counterexamples: [The photon magnitudes recorded by a survey.]
    boundary_notes: This term names model-derived heating properties without claiming a complete posterior analysis or collapsing the energy reservoir, transfer mechanism, or fitting technique.
    curation_provenance: { actor_id: actor:agent-curator, recorded_at: "2026-09-04T13:19:10Z" }
    review_state: reviewed
    review_provenance: { actor_id: actor:human-curator, recorded_at: "2026-09-04T22:15:06Z" }
