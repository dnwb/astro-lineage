id: energy_dissipation
label: Energy dissipation
question: Where does macroscopic or field energy become thermal or non-thermal particle energy?
default_risk: descriptive
terms:
  - id: term:jet-head-shock-heating
    label: Jet-head shock heating
    aliases: [head-shock dissipation]
    status: active
    definition: Conversion of directed jet and ambient-medium kinetic energy into thermal energy at forward and reverse shocks in the jet head.
    examples: [Shocked head material heating and flowing sideways into the cocoon.]
    counterexamples: [Bulk energy transport by the unshocked jet before it reaches the head.]
    boundary_notes: This is a macroscopic dissipation process and does not specify microscopic particle acceleration.
    allowed_functional_roles: [energy_dissipation]
    curation_provenance: { actor_id: actor:agent-curator, recorded_at: "2026-09-04T09:20:00Z" }
    review_state: reviewed
    review_provenance: { actor_id: actor:human-curator, recorded_at: "2026-09-04T12:30:31Z" }
  - id: term:decay-deposition-heating
    label: Decay deposition and heating
    aliases: [radioactive deposition]
    status: active
    definition: Deposition of radioactive decay energy in ejecta that heats the modeled material.
    examples:
      - Gamma-ray and positron energy deposited to heat Type I supernova ejecta.
    counterexamples:
      - The bolometric luminosity inferred from the resulting light curve.
    boundary_notes: This term names the macroscopic heating role; microscopic decay channels remain separately represented when needed.
    allowed_functional_roles: [energy_dissipation]
    curation_provenance:
      actor_id: actor:agent-curator
      recorded_at: "2026-09-04T04:00:00Z"
    review_state: reviewed
    review_provenance:
      actor_id: actor:human-curator
      recorded_at: "2026-09-04T12:30:31Z"
  - id: term:reverse-shock-particle-acceleration
    label: Reverse-shock particle acceleration
    aliases: [jet reverse-shock acceleration]
    status: active
    definition: Conversion of bulk jet energy at a reverse shock into a nonthermal particle population.
    examples: [Acceleration of protons at the reverse shock of a choked GRB jet.]
    counterexamples: [A proton-proton collision after acceleration, which is a particle interaction.]
    boundary_notes: This term records macroscopic dissipation into nonthermal particles, not the later microscopic reaction.
    allowed_functional_roles: [energy_dissipation]
    curation_provenance: { actor_id: actor:agent-curator, recorded_at: "2026-09-04T10:15:03Z" }
    review_state: reviewed
    review_provenance: { actor_id: actor:human-curator, recorded_at: "2026-09-04T12:30:31Z" }
