      paragraph: Abstract
    excerpt: A fluid dynamical treatment of an ultra-relativistic spherical blast
      wave enclosed by a strong shock is presented. A simple similarity solution
      describing the explosion of a fixed amount of energy in a uniform medium
      is derived, and this is generalized to include cases in which power is
      supplied by a central source and the density of the external medium varies
      with radius.
