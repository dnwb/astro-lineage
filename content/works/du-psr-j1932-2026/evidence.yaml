    locator:
      type: paragraph
      paragraph: Abstract
    excerpt: PSR J1932+2121 is a newly discovered spider pulsar with a pronounced radio eclipse identified by FAST. By modeling the orbital-phase-dependent dispersion measure variations and flux profiles during the eclipse region with the wind interaction and IBS geometry, we constrain the system to a nearly edge-on inclination and a weak stellar wind from a low-mass main-sequence companion.
