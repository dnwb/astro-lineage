    locator:
      type: paragraph
      paragraph: Abstract
    excerpt: It is believed that the relativistic jets of gamma-ray bursts (GRBs) should initially propagate through a heavy envelope of the massive progenitor stars or through a merger ejecta formed from the compact binary mergers. The interaction of a jet with a stellar envelope or a merger ejecta can lead to the deceleration of the head material of the jet and simultaneously the formation of a hot cocoon.
    curation_provenance:
