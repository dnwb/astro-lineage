      paragraph: Abstract
    excerpt: The recently discovered GRB afterglow is believed to be described
      reasonably well by synchrotron emission from a slowing down relativistic
      shell that collides with an external medium. To compare theoretical models
      with afterglow observations we calculate here the broad band spectrum and
      corresponding light curve of synchrotron radiation from a power-law
      distribution of electrons in an expanding relativistic shock.
