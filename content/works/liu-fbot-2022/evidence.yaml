    excerpt: We fit the multi-band lightcurves of 40 fast blue optical transients (FBOTs) with the magnetar engine model. The mass of the FBOT ejecta, the initial spin period and polar magnetic field of the FBOT magnetars are respectively constrained to M_ej = 0.18 M_sun, P_i = 9.4 ms, and B_p = 7 x 10^14 G.
