    locator:
      type: paragraph
      paragraph: Abstract
    excerpt: Recent observations of FRB 20220529 reveal significant variation and a partial reversal in its rotation measure (RM), suggesting the presence of a dynamically evolving magnetized environment, which could be caused by the orbital motion of the magnetar within the binary system. Here we develop the binary model by suggesting that the spin and magnetic axis of the companion star could undergo precession around the orbital axis.
