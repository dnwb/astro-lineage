  - id: evidence:zhang-agn-jet-2024-choking-breakout
    version_id: version:zhang-agn-jet-2024-arxiv-v1
    source_url: https://arxiv.org/abs/2406.10904v1
    locator:
      type: paragraph
      paragraph: Section 3
    excerpt: A relativistic jet can break out from the AGN disk scale height if the
      engine duration exceeds the breakout time t_bo <= T_eng; otherwise the jet
      is choked inside the disk.
    review_state: reviewed
    review_provenance:
      actor_id: actor:human-curator
      recorded_at: 2026-09-06T22:36:00Z
    curation_provenance:
