    review_state: reviewed
    review_provenance:
      actor_id: actor:human-curator
      recorded_at: "2026-09-04T12:30:31Z"
  - id: term:jet-stalling-and-choking
    label: Jet stalling and choking
    aliases: [choked-jet dynamics]
    status: active
    definition: Macroscopic jet evolution in which the jet head stalls before crossing the confining medium.
    examples: [A GRB jet whose stalling radius is smaller than the AGN-disk scale height.]
    counterexamples: [A jet that reaches the medium boundary and breaks out.]
