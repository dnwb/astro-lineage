name: V0.1 verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v0.1-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Offline V0.1 verification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: true
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.20.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      # Verification reads only committed canonical content and never
      # contacts bibliographic providers or paper sources.
      - name: Run the V0.1 completion proof
        run: npm run verify
