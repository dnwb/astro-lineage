      paragraph: Abstract
    excerpt: We present TransFit-CSM, a fast and physically consistent framework for
      modeling interaction-powered transients. The method self-consistently
      couples the ejecta circumstellar medium (CSM) shock dynamics to radiative
      diffusion from a moving heating boundary tied to the shocks, so that both
      the photon escape path and the effective diffusion time evolve with radius
      and time.
