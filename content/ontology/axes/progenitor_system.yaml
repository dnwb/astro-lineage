  - id: term:near-chandrasekhar-carbon-ignition
    label: Near-Chandrasekhar carbon ignition
    aliases: [degenerate carbon ignition]
    status: active
    definition: A degenerate carbon-rich stellar configuration near the Chandrasekhar mass in which carbon ignition produces a thermonuclear explosion model.
    examples:
      - Degenerate carbon ignition near the Chandrasekhar mass in Arnett's thermonuclear model class.
    counterexamples:
      - Collapse of an evolved helium star, which is a distinct modeled configuration.
