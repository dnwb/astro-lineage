terms:
  - id: term:blackbody-spectrum-approximation
    label: Blackbody-spectrum approximation
    aliases: [blackbody construct]
    status: active
    definition: An explicitly approximate blackbody spectral construct used to connect modeled luminosity and temperature to a photon spectrum.
    examples:
      - A blackbody approximation used for the emergent Type I supernova spectrum.
    counterexamples:
      - Effective temperature treated as a directly measured observable rather than a model-dependent quantity.
    boundary_notes: The term records a modeling approximation, not a claim that the spectrum is exactly blackbody or that temperature is directly observed.
    allowed_functional_roles: [emission_process]
