    source_url: https://arxiv.org/abs/2011.08428v3
    locator:
      type: section
      section: "2. Jet Propagation and Choking Condition in AGN Disks"
    excerpt: "Due to extreme gas density in the AGN disk migration trap, relativistic jets launched from neutron star mergers are choked before breaking out."
    curation_provenance:
      actor_id: actor:agent-curator
      recorded_at: "2026-11-02T12:00:00Z"
