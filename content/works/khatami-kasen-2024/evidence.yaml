      paragraph: Abstract
    excerpt: The interaction of supernova ejecta with a surrounding circumstellar
      medium (CSM) generates a strong shock which can convert the ejecta kinetic
      energy into observable radiation. Given the diversity of potential CSM
      structures (arising from diverse mass loss processes such as late-stage
      stellar outbursts, binary interaction, and winds), the resulting
      transients can display a wide range of light curve morphologies.
