      section: "II. Self-Similar Blast Waves"
    excerpt: "In the ultra-relativistic limit where Gamma >> 1, the shocked fluid is concentrated in a thin shell of thickness delta R ~ R / Gamma^2, with shock Lorentz factor scaling as Gamma^2 proportional to R^-(3-k)."
