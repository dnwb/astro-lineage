    locator:
      type: section
      section: "3. Uniform Light-Curve Fitting and CSM Interaction"
    excerpt: "The optical light curves of SNe Ibn, SNe Icn, and FBOTs are powered by radiative shock interaction between fast ejecta and dense, confined circumstellar shells."
