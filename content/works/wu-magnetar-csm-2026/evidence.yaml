    excerpt: Superluminous supernovae (SLSNe) are often modeled as being powered
      either by a central engine or by strong interaction with dense
      circumstellar material (CSM). These two mechanisms may be dynamically
      coupled if the ejecta interact with dense CSM while being energized by a
      newborn magnetar.
