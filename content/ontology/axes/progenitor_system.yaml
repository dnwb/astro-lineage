id: progenitor_system
label: Progenitor system
question: What physical system or object configuration gives rise to the modeled event or source?
default_risk: descriptive
terms:
  - id: term:massive-star-collapsar-system
    label: Massive-star collapsar system
    aliases: [collapsar progenitor]
    status: active
    definition: A massive-star collapse system in which a central engine launches a relativistic jet through the stellar envelope.
    examples: [A GRB jet propagating through a compact Wolf-Rayet progenitor.]
    counterexamples: [An AGN jet propagating through a galactic halo.]
    boundary_notes: This term identifies the stellar progenitor application, not every environment to which the jet model applies.
    curation_provenance: { actor_id: actor:agent-curator, recorded_at: "2026-09-04T09:20:00Z" }
    review_state: reviewed
    review_provenance: { actor_id: actor:human-curator, recorded_at: "2026-09-04T09:21:00Z" }
  - id: term:near-chandrasekhar-carbon-ignition
    label: Near-Chandrasekhar carbon ignition
    aliases: [degenerate carbon ignition]
    status: active
    definition: A degenerate carbon-rich stellar configuration near the Chandrasekhar mass in which carbon ignition produces a thermonuclear explosion model.
    examples:
      - Degenerate carbon ignition near the Chandrasekhar mass in Arnett's thermonuclear model class.
    counterexamples:
      - Collapse of an evolved helium star, which is a distinct modeled configuration.
    boundary_notes: Use for the concrete thermonuclear configuration represented by the Work; do not infer that the Work uniquely identifies it as the physical progenitor.
    curation_provenance:
      actor_id: actor:agent-curator
      recorded_at: "2026-09-04T04:00:00Z"
    review_state: reviewed
    review_provenance:
      actor_id: actor:human-curator
      recorded_at: "2026-09-04T04:05:00Z"
  - id: term:evolved-helium-star-collapse
    label: Evolved helium-star collapse
    aliases: [helium-star collapse]
    status: active
    definition: An evolved helium-star configuration whose collapse produces the ejecta in a collapse explosion model.
    examples:
      - Collapse of an evolved helium star in Arnett's collapse model class.
    counterexamples:
      - Degenerate carbon ignition near the Chandrasekhar mass, which is a distinct modeled configuration.
    boundary_notes: Use for the concrete collapse configuration represented by the Work; do not infer that the Work uniquely identifies it as the physical progenitor.
