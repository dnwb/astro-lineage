id: energy_reservoir
label: Energy reservoir
question: What form or store of energy is available to power the modeled system?
default_risk: descriptive
terms:
  - id: term:central-engine-jet-power
    label: Central-engine jet power
    aliases: [jet luminosity reservoir]
    status: active
    definition: Energy supplied by an inner compact-object engine and available to power a relativistic jet.
    examples: [The jet luminosity used as an initial parameter in an analytic jet-cocoon model.]
    counterexamples: [Cocoon pressure, which is a state produced by deposited jet energy.]
    boundary_notes: The term names the available engine-supplied power, not the transfer process or outflow itself.
    curation_provenance: { actor_id: actor:agent-curator, recorded_at: "2026-09-04T09:20:00Z" }
    review_state: reviewed
    review_provenance: { actor_id: actor:human-curator, recorded_at: "2026-09-04T12:30:31Z" }
  - id: term:radioactive-decay-energy
    label: Radioactive decay energy
    aliases: [radioactive energy]
    status: active
    definition: Energy made available to the modeled ejecta by radioactive decay of synthesized nuclei.
    examples:
      - Nickel-56 decay energy used to power an early Type I supernova light curve.
    counterexamples:
      - The expanding ejecta itself, which is an outflow rather than an energy reservoir.
    boundary_notes: This term identifies stored available energy, not the later deposition process or an observed luminosity.
    curation_provenance:
      actor_id: actor:agent-curator
      recorded_at: "2026-09-04T04:00:00Z"
    review_state: reviewed
    review_provenance:
      actor_id: actor:human-curator
