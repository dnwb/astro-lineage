      paragraph: Abstract
    excerpt: It has been widely recognized that gamma-ray burst (GRB) afterglows
      arise from interactions between GRB outflow and circumburst medium, while
      their evolution follows the behaviors of relativistic shock waves.
      Assuming the distribution of circumburst medium follows a general
      power-law form, that is, $n = A_{\ast} R^{-k}$, where $R$ denotes the
      distance from the burst, it is obvious that the value of
      density-distribution index $k$ can affect the behaviors of the afterglow.
