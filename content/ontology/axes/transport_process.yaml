id: transport_process
label: Transport process
question: Which propagation, absorption, scattering, diffusion, or escape process alters a messenger before observation?
default_risk: descriptive
terms:
  - id: term:radiative-diffusion-escape
    label: Radiative diffusion and escape
    aliases: [photon diffusion]
    status: active
    definition: Transport of radiation through expanding ejecta by diffusion and eventual escape to the observer.
    examples:
      - Time-dependent radiative diffusion controlling the rise and decline of a supernova light curve.
    counterexamples:
      - Radioactive decay, which supplies and deposits energy before transport.
    boundary_notes: Keep photon transport distinct from emission and from the luminosity inferred from measurements.
    allowed_functional_roles: [transport_process]
