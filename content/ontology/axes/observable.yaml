id: observable
label: Observable
question: What form of measurement is actually recorded?
default_risk: descriptive
terms:
  - id: term:jet-break-opening-angle
    label: Jet-break opening angle
    aliases: [afterglow jet-break angle]
    status: active
    definition: A jet opening angle estimated from an identified break in an afterglow light curve.
    examples: [A late-time GRB jet-break angle used to constrain the injection angle.]
    counterexamples: [The inferred collimation regime inside the progenitor star.]
    boundary_notes: Store the measured or observation-derived angle here; physical conditions inferred from it belong to inference_target.
    curation_provenance: { actor_id: actor:agent-curator, recorded_at: "2026-09-04T09:20:00Z" }
    review_state: reviewed
    review_provenance: { actor_id: actor:human-curator, recorded_at: "2026-09-04T12:30:31Z" }
  - id: term:observed-jet-luminosity
    label: Observed jet luminosity
    aliases: [beaming-corrected jet luminosity]
    status: active
    definition: Luminosity attributed observationally to a jet and used as an input to a physical regime assessment.
    examples: [A GRB jet luminosity corrected using a representative beaming angle.]
    counterexamples: [The model-inferred cocoon pressure.]
    boundary_notes: This term describes the measured input form, not the engine energy reservoir or inferred jet state.
    curation_provenance: { actor_id: actor:agent-curator, recorded_at: "2026-09-04T09:20:00Z" }
    review_state: reviewed
    review_provenance: { actor_id: actor:human-curator, recorded_at: "2026-09-04T12:30:31Z" }
  - id: term:measured-magnitudes
    label: Measured magnitudes
    aliases: [photometric magnitudes]
    status: active
    definition: Photometric magnitude measurements recorded in one or more electromagnetic bands.
    examples:
      - U, B, and V magnitudes reported for a Type I supernova light curve.
    counterexamples:
      - Intrinsic luminosity inferred from those measurements.
    boundary_notes: Observable records the measured form and must not contain model-inferred parameters such as effective temperature.
    curation_provenance:
      actor_id: actor:agent-curator
      recorded_at: "2026-09-04T04:00:00Z"
    review_state: reviewed
    review_provenance:
      actor_id: actor:human-curator
      recorded_at: "2026-09-04T12:30:31Z"
  - id: term:light-curves
    label: Light curves
    aliases: [time-dependent photometry]
    status: active
    definition: Time series of measured brightness or magnitude used to characterize the transient.
    examples:
      - B-band and V-band light curves compared with the analytic solution.
    counterexamples:
      - A model's intrinsic luminosity output, which is an inference target.
    boundary_notes: Light curves are actual measurement forms; derived physical parameters remain outside this axis.
    curation_provenance:
      actor_id: actor:agent-curator
      recorded_at: "2026-09-04T04:00:00Z"
    review_state: reviewed
    review_provenance:
      actor_id: actor:human-curator
      recorded_at: "2026-09-04T12:30:31Z"
  - id: term:all-flavor-neutrino-fluence
    label: All-flavor neutrino fluence
    aliases: [neutrino spectral fluence]
    status: active
    definition: Energy-dependent time-integrated neutrino flux summed over neutrino flavors as an observable signal form.
    examples: [The single-event all-flavor fluence plotted for a choked GRB.]
    counterexamples: [The hadronic reaction that produced the neutrinos.]
    boundary_notes: This term names the signal form, not an inferred source parameter.
    curation_provenance: { actor_id: actor:agent-curator, recorded_at: "2026-09-04T10:15:15Z" }
    review_state: reviewed
    review_provenance: { actor_id: actor:human-curator, recorded_at: "2026-09-04T12:30:31Z" }
  - id: term:detected-neutrino-count
    label: Detected neutrino event count
    aliases: [neutrino detection count]
    status: active
    definition: The discrete count form recorded by a neutrino detector after applying its response to an incident signal.
    examples: [An expected IceCube event count calculated by effective-area folding.]
    counterexamples: [The source's expected physical neutrino yield before detector response.]
    boundary_notes: The ontology term describes the measurable form; a model-predicted value remains a prediction.
    curation_provenance: { actor_id: actor:agent-curator, recorded_at: "2026-09-04T10:15:16Z" }
    review_state: reviewed
    review_provenance: { actor_id: actor:human-curator, recorded_at: "2026-09-04T12:30:31Z" }
  - id: term:shock-breakout-photon-transient
    label: Shock-breakout photon transient
    aliases: [cocoon breakout transient]
    status: active
    definition: A time-localized electromagnetic signal measured from cocoon shock breakout.
    examples: [A soft low-luminosity gamma-ray transient from an AGN-disk cocoon.]
    counterexamples: [The cocoon shock-breakout emission mechanism.]
    boundary_notes: This term names the measurable signal form, not its band or production mechanism.
    curation_provenance: { actor_id: actor:agent-curator, recorded_at: "2026-09-04T10:15:17Z" }
    review_state: reviewed
    review_provenance: { actor_id: actor:human-curator, recorded_at: "2026-09-04T12:30:31Z" }
