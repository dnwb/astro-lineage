      paragraph: Abstract
    excerpt: We provide a general analysis on the properties of emitting material of some rapidly evolving and luminous transients discovered recently with the Pan-STARRS1 Medium Deep Survey. It is found that these transients are probably produced by a low-mass non-relativistic outflow that is continuously powered by a newly born, rapidly spinning, and highly magnetized neutron star.
