      paragraph: Abstract
    excerpt: SNe Ibn and SNe Icn are stripped-envelope explosions whose optical
      emission is commonly linked to interaction with H-poor circumstellar
      material (CSM), whereas fast blue optical transients (FBOTs) form an
      observational class of rapidly evolving, blue, and luminous events with
      diverse proposed power sources. We present a uniform comparison of these
      transients to test whether they are separated in optical light-curve and
      fitted physical parameter space.
