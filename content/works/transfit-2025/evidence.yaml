    source_url: https://arxiv.org/abs/2505.13825v1
    locator: { type: section, section: Abstract }
    excerpt: This paper introduces TransFit, a novel framework that numerically solves a generalized energy conservation equation, explicitly incorporating time-dependent radiative diffusion, continuous radioactive or central engine heating, and ejecta expansion dynamics.
