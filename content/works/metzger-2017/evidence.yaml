    excerpt: Sub-arcsecond localization of the repeating fast radio burst FRB 121102
      revealed its coincidence with a dwarf host galaxy and a steady
      (`quiescent') non-thermal radio source. We show that the properties of the
      host galaxy are consistent with those of long-duration gamma-ray bursts
      (LGRB) and hydrogen-poor superluminous supernovae (SLSNe-I).
