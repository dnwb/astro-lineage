id: phenomenon
label: Phenomenon
question: What observational event or source class does the Work address?
default_risk: descriptive
terms:
  - id: term:relativistic-jet-propagation
    label: Relativistic jet propagation
    aliases: [jet-cocoon evolution]
    status: active
    definition: Evolution of a relativistic jet, its shocked head, and cocoon while crossing an external medium.
    examples: [Collimated and uncollimated propagation regimes in stellar, ISM, or halo environments.]
    counterexamples: [A supernova light curve powered only by radioactive diffusion.]
    boundary_notes: This phenomenon groups the modeled system without asserting a specific progenitor or messenger.
    curation_provenance: { actor_id: actor:agent-curator, recorded_at: "2026-09-04T09:20:00Z" }
    review_state: reviewed
    review_provenance: { actor_id: actor:human-curator, recorded_at: "2026-09-04T12:30:31Z" }
  - id: term:type-i-supernova
    label: Type I supernova
    aliases: [Type I SN]
    status: active
    definition: A hydrogen-poor supernova phenomenon class addressed by the Work's analytic light-curve model.
    examples:
      - Type I supernova light curves modeled across alternative explosion systems.
    counterexamples:
      - A photon band such as U, B, or V, which describes an observation channel.
    boundary_notes: Use as the phenomenon class without encoding a unique progenitor or engine.
    curation_provenance:
      actor_id: actor:agent-curator
      recorded_at: "2026-09-04T04:00:00Z"
    review_state: reviewed
    review_provenance:
      actor_id: actor:human-curator
      recorded_at: "2026-09-04T12:30:31Z"
  - id: term:choked-grb-in-agn-disk
    label: Choked GRB in an AGN disk
    aliases: [AGN-disk choked gamma-ray burst]
    status: active
    definition: A gamma-ray-burst source whose relativistic jet is stopped within the dense gas of an active-galactic-nucleus accretion disk.
    examples: [A long or short GRB embedded in an AGN disk with a stalling radius below the disk scale height.]
    counterexamples: [A freely escaping GRB jet outside a dense confining disk.]
    boundary_notes: The phenomenon groups the event context without identifying a single progenitor channel or messenger.
    curation_provenance: { actor_id: actor:agent-curator, recorded_at: "2026-09-04T10:15:10Z" }
    review_state: reviewed
    review_provenance: { actor_id: actor:human-curator, recorded_at: "2026-09-04T12:30:31Z" }
  - id: term:transient-light-curve-evolution
    label: Transient light-curve evolution
    aliases: [luminous-transient light-curve evolution]
    status: active
    definition: Time-dependent brightness evolution of a luminous transient modeled across its rise and decline.
    examples: [Bolometric and multiband light-curve evolution of supernovae fitted with a diffusion model.]
    counterexamples: [A numerical discretization used to compute the light curve.]
    boundary_notes: This is the phenomenon under study, not the measured light-curve form, the transport process, or the fitting technique.
    curation_provenance: { actor_id: actor:agent-curator, recorded_at: "2026-09-04T13:18:40Z" }
    review_state: reviewed
    review_provenance: { actor_id: actor:human-curator, recorded_at: "2026-09-04T22:15:06Z" }
