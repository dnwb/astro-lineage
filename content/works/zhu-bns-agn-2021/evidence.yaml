    excerpt: Neutron star mergers are believed to occur in accretion disks around
      supermassive black holes. Here we show that a putative jet launched from
      the merger of a binary neutron star (BNS) or a neutron star--black hole
      (NSBH) merger occurring at the migration trap in an active galactic
      nucleus (AGN) disk would be choked.
