  - id: evidence:zhang-agn-jet-2024-cocoon-emission
    version_id: version:zhang-agn-jet-2024-arxiv-v1
    source_url: https://arxiv.org/abs/2406.10904v1
    locator:
      type: paragraph
      paragraph: Section 4
    excerpt: For choked jets, the energy transferred to the cocoon causes the cocoon
      to expand sideways and break out from the disk surface, generating
      transient electromagnetic radiation.
