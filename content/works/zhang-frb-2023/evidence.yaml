    locator:
      type: paragraph
      paragraph: Abstract
    excerpt: Fast radio bursts (FRBs), millisecond-duration bursts prevailing in the radio sky, are the latest big puzzle in the universe and have been a subject of intense observational and theoretical investigations in recent years. The rapid accumulation of the observational data has painted the following sketch about the physical origin of FRBs. They predominantly originate from cosmological distances so that their sources produce the most extreme coherent radio emission in the universe. At least some, probably most, FRBs are repeating sources that do not invoke cataclysmic events; and at least some FRBs are produced by magnetars, neutron stars with the strongest magnetic fields in the universe.
