  - id: evidence:zhang-agn-jet-2024-abstract
    version_id: version:zhang-agn-jet-2024-arxiv-v1
    source_url: https://arxiv.org/abs/2406.10904v1
    locator:
      type: paragraph
      paragraph: Abstract
    excerpt: The accretion disks of supermassive black holes (SMBHs) harboring in
      active galactic nuclei (AGN) are considered to be an ideal site for
      producing different types of gamma-ray bursts (GRBs). The detectability of
      these GRB phenomena hidden in AGN disks is highly dependent on the
      dynamical evolution of the GRB relativistic jets.
    review_state: reviewed
    review_provenance:
      actor_id: actor:human-curator
      recorded_at: 2026-09-06T22:36:00Z
    curation_provenance:
      actor_id: actor:agent-curator
