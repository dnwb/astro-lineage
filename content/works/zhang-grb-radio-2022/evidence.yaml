    version_id: version:zhang-grb-radio-2022-arxiv-v1
    source_url: https://arxiv.org/abs/2203.08646v1
    locator:
      type: paragraph
      paragraph: Abstract
    excerpt: It has been widely recognized that gamma-ray burst (GRB) afterglows arise from interactions between GRB outflow and circumburst medium, while their evolution follows the behaviors of relativistic shock waves. Assuming the distribution of circumburst medium follows a general power-law form, that is, n = A_* R^-k, where R denotes the distance from the burst, it is obvious that the value of density-distribution index k can affect the behaviors of the afterglow.
    curation_provenance:
      actor_id: actor:agent-curator
      recorded_at: "2026-11-02T12:00:00Z"
    review_state: unreviewed
