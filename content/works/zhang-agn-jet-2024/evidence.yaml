  - id: evidence:zhang-agn-jet-2024-head-propagation
    version_id: version:zhang-agn-jet-2024-arxiv-v1
    source_url: https://arxiv.org/abs/2406.10904v1
    locator:
      type: paragraph
      paragraph: Section 2
    excerpt: We analyze the propagation of relativistic jets injected into dense AGN
      disks by balancing the jet forward shock ram pressure against the ambient
      disk medium ram pressure.
    review_state: reviewed
    review_provenance:
      actor_id: actor:human-curator
      recorded_at: 2026-09-06T22:36:00Z
    curation_provenance:
