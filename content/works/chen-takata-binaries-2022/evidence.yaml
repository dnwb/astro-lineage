    excerpt: Be/$γ$-ray binaries comprise a confirmed or presumptive pulsar orbiting
      a Be star and emit luminous $γ$-rays. Non-thermal emissions are thought to
      arise from synchrotron radiation and inverse-Compton (IC) scattering in
      the shock where the pulsar wind is terminated by the stellar outflow.
