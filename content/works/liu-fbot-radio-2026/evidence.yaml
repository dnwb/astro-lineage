    locator:
      type: paragraph
      paragraph: Abstract
    excerpt: Fast blue optical transients (FBOTs) are luminous, rapidly evolving explosions whose radio emission provides a sensitive probe of shock interaction and the circumstellar material (CSM) surrounding the progenitor. However, the origin of their diverse radio light-curve morphologies, especially the very steep post-peak declines seen in several well-sampled events, remains unclear.
